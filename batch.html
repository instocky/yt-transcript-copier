<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Batch: Загрузить URLs</title>
  <link rel="stylesheet" href="batch.css">
</head>
<body>
  <h1>📥 Загрузить URLs (batch)</h1>

  <div class="input-row">
    <label class="file-picker">
      <input type="file" id="file-input" accept=".txt,text/plain" hidden>
      <span class="file-picker-btn">📁 Выбрать .txt файл</span>
    </label>
    <span id="file-name" class="muted">файл не выбран</span>
  </div>

  <details>
    <summary>или вставьте URLs вручную (по одному на строку)</summary>
    <textarea id="urls-input" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false"></textarea>
  </details>

  <div class="button-row">
    <button id="start-btn" type="button" disabled>▶ Start</button>
    <button id="cancel-btn" type="button" disabled>✕ Cancel</button>
    <span class="spacer"></span>
    <button id="close-btn" type="button">Закрыть</button>
  </div>

  <div class="status">
    <div id="status-text">Готово к запуску</div>
    <progress id="progress-bar" value="0" max="1"></progress>
    <ul id="results" aria-live="polite"></ul>
  </div>

  <script src="batch.js"></script>
</body>
</html>
